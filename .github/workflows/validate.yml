name: Validate OnePlus

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore executable permissions for validation
        run: |
          chmod +x setup.sh install.sh uninstall.sh bin/oneplus lib/*.sh modules/*.sh libexec/* scripts/*.sh

      - name: Static validation
        run: bash scripts/validate.sh

      - name: User module static tests
        run: sudo bash scripts/test-users.sh

      - name: Validate systemd units
        run: |
          if [ -e /opt/oneplus ]; then
            echo '/opt/oneplus já existe no runner; não é seguro sobrescrever.' >&2
            exit 1
          fi
          sudo ln -s "$GITHUB_WORKSPACE" /opt/oneplus
          trap 'sudo rm -f /opt/oneplus' EXIT
          systemd-analyze verify systemd/*.service systemd/*.timer
